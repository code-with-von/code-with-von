name: Metrics
on:
  schedule: [{ cron: "0 */4 * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes

      - name: Snippet
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/snippet.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_code: yes
          plugin_code_load: 400

      - name: Starred
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 3

      - name: Stargazers
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/stargazers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stargazers: yes

      - name: Followup
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes

      - name: Reactions
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage

      - name: Followers
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/people.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_people: yes
          plugin_people_types: followers

      - name: Summary
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/summary.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: repositories
          plugin_lines: yes

      - name: LeetCode
        uses: lowlighter/metrics@latest
        with:
          user: vonschappler
          filename: metrics/leetcode.svg
          token: NOT_NEEDED
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_user: vonschappler
